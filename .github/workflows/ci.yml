name: Autonomous tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    # Standard hosted runners are free on public repositories. Skip every
    # trigger, including manual dispatch, while the repository is private.
    if: ${{ github.event.repository.visibility == 'public' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Runtime dependencies
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r requirements-runtime.txt
      - name: Python synthetic and loopback suites
        run: python3 tools/run-python-tests.py --summary /tmp/python-tests.json
      - name: Swift core, stores and WebKit DOM
        run: python3 tools/run-swift-tests.py --summary /tmp/swift-tests.json -- --disable-sandbox --scratch-path /tmp/katalog-ci
      - name: Report interactions
        run: node --test Tests/test_report_interaction.cjs
      - name: Publication guard
        run: python3 tools/check-publication.py --include-untracked
      - name: Patch hygiene
        run: git diff --check
  package-smoke:
    name: Package ARM64 / ${{ matrix.os }}
    if: ${{ github.event.repository.visibility == 'public' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            major: '15'
          # Official macOS 27 image, currently a public preview.
          - os: xcode-27
            major: '27'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      KATALOG_SMOKE_EXPECT_MAJOR: ${{ matrix.major }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Autonomous engine, embedded Sparkle and synthetic runtime
        run: bash tools/package-smoke.sh
      - name: Summarize local verification
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          report = pathlib.Path('reports/package-smoke-verification.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## ARM64 packaging smoke\n\n')
              if report.is_file():
                  data = json.loads(report.read_text())
                  for item in data.get('checks', []):
                      summary.write('- %s: %s\n' % (item['category'], item['status']))
              else:
                  summary.write('Build did not reach runtime verification. See job logs.\n')
              summary.write('\nAd hoc build only. No release, notarization, private corpus or live fleet.\n')
          PY
