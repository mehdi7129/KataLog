name: Autonomous tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Build candidates, validate signed draft assets, or diagnose native tests
        type: choice
        options: [build-candidate, verify-signed, native-diagnostics]
        default: build-candidate
      validation_architecture:
        description: Architecture for tests and ad hoc packages only; signed verification always covers all four hosts
        type: choice
        options: [all, arm64, x86_64]
        default: all
      diagnostic_platform:
        description: Intel hosts for isolated native diagnostics only
        type: choice
        options: [both, intel15, intel26]
        default: both
      release_tag:
        description: Draft release tag for signed validation
        type: string
      expected_commit:
        description: Exact 40-character source commit for signed validation or native diagnostics
        type: string
      arm64_zip_sha256:
        description: Expected SHA-256 of the signed arm64_zip asset
        type: string
      arm64_dmg_sha256:
        description: Expected SHA-256 of the signed arm64_dmg asset
        type: string
      x86_64_zip_sha256:
        description: Expected SHA-256 of the signed x86_64_zip asset
        type: string
      x86_64_dmg_sha256:
        description: Expected SHA-256 of the signed x86_64_dmg asset
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode || 'build-candidate' }}
  cancel-in-progress: true
jobs:
  tests:
    # Keep the historical ARM context names required by main branch protection.
    name: ${{ matrix.arch == 'arm64' && format('tests ({0})', matrix.os) || format('tests ({0}, {1}, {2})', matrix.os, matrix.major, matrix.arch) }}
    # Standard hosted runners are free on public repositories. Skip every
    # trigger, including manual dispatch, while the repository is private.
    if: ${{ github.event.repository.visibility == 'public' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'build-candidate') }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.validation_architecture == 'arm64' && '[{"os":"macos-15","major":"15","arch":"arm64"},{"os":"macos-26","major":"26","arch":"arm64"}]'
            || inputs.validation_architecture == 'x86_64' && '[{"os":"macos-15-intel","major":"15","arch":"x86_64"},{"os":"macos-26-intel","major":"26","arch":"x86_64"}]'
            || '[{"os":"macos-15","major":"15","arch":"arm64"},{"os":"macos-26","major":"26","arch":"arm64"},{"os":"macos-15-intel","major":"15","arch":"x86_64"},{"os":"macos-26-intel","major":"26","arch":"x86_64"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify native runner
        run: python3 tools/check-native-host.py --architecture '${{ matrix.arch }}' --major '${{ matrix.major }}' --output reports/ci/native-host.json
      - name: Runtime dependencies
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r requirements-runtime.txt
      - name: Record synthetic validation conditions
        run: python3 tools/write-ci-context.py --output reports/ci/context.json --fixture synthetic-and-loopback
      - name: Alert catalogue data and generated source
        run: python3 tools/generate-alert-catalogue.py --check
      - name: Python synthetic and loopback suites
        shell: bash
        run: python3 tools/run-python-tests.py --summary reports/ci/python-tests.json 2>&1 | tee reports/ci/python-tests.log
      - name: Swift core, stores and WebKit DOM
        run: python3 tools/run-swift-tests.py --summary reports/ci/swift-tests.json --log reports/ci/swift-tests.log -- --disable-sandbox --scratch-path /tmp/katalog-ci
      - name: Report interactions
        shell: bash
        run: node --test Tests/test_report_interaction.cjs 2>&1 | tee reports/ci/report-tests.log
      - name: Publication guard
        run: python3 tools/check-publication.py --include-untracked
      - name: Patch hygiene
        run: git diff --check
      - name: Keep synthetic test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/ci/
          retention-days: 14
          if-no-files-found: warn
  package-smoke:
    # xcode-27 is the historical protected context for the macOS 26 ARM package.
    name: ${{ matrix.arch == 'arm64' && (matrix.os == 'macos-26' && 'Package ARM64 / xcode-27' || 'Package ARM64 / macos-15') || format('Package {0} / {1}', matrix.arch, matrix.os) }}
    if: ${{ github.event.repository.visibility == 'public' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'build-candidate') }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.validation_architecture == 'arm64' && '[{"os":"macos-15","major":"15","arch":"arm64"},{"os":"macos-26","major":"26","arch":"arm64"}]'
            || inputs.validation_architecture == 'x86_64' && '[{"os":"macos-15-intel","major":"15","arch":"x86_64"},{"os":"macos-26-intel","major":"26","arch":"x86_64"}]'
            || '[{"os":"macos-15","major":"15","arch":"arm64"},{"os":"macos-26","major":"26","arch":"arm64"},{"os":"macos-15-intel","major":"15","arch":"x86_64"},{"os":"macos-26-intel","major":"26","arch":"x86_64"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      KATALOG_SMOKE_EXPECT_MAJOR: ${{ matrix.major }}
      KATALOG_ARCH: ${{ matrix.arch }}
      KATALOG_SMOKE_UPDATE_CHANNEL: stable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Record packaging conditions
        run: python3 tools/write-ci-context.py --output reports/ci/context.json --fixture ad-hoc-synthetic-package
      - name: Autonomous engine, embedded Sparkle and synthetic runtime
        shell: bash
        run: bash tools/package-smoke.sh 2>&1 | tee reports/ci/package-smoke.log
      - name: Summarize local verification
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          report = pathlib.Path('reports/package-smoke-verification.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Native packaging smoke\n\n')
              if report.is_file():
                  data = json.loads(report.read_text())
                  for item in data.get('checks', []):
                      summary.write('- %s: %s\n' % (item['category'], item['status']))
              else:
                  summary.write('Build did not reach runtime verification. See job logs.\n')
              summary.write('\nAd hoc build only. No release, notarization, private corpus or live fleet.\n')
          PY
      - name: Keep packaging evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            reports/ci/
            reports/package-smoke-verification.json
          retention-days: 14
          if-no-files-found: warn

      - name: Keep exact ad hoc candidate ZIP for local signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.arch }}-${{ matrix.os }}-${{ github.sha }}
          path: reports/candidate/
          retention-days: 14
          if-no-files-found: error
  native-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.visibility == 'public' && inputs.mode == 'native-diagnostics' }}
    permissions:
      contents: read
    uses: ./.github/workflows/native-diagnostics.yml
    with:
      source_commit: ${{ inputs.expected_commit }}
      platform: ${{ inputs.diagnostic_platform }}
  verify-signed:
    name: Signed candidate ${{ matrix.arch }} / ${{ matrix.os }}
    # GitHub only exposes draft releases to identities with push access.
    # This manual qualification job reads assets; it never publishes them.
    permissions:
      contents: write
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.visibility == 'public' && inputs.mode == 'verify-signed' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, major: '15', arch: arm64}
          - {os: macos-26, major: '26', arch: arm64}
          - {os: macos-15-intel, major: '15', arch: x86_64}
          - {os: macos-26-intel, major: '26', arch: x86_64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      ZIP_SHA256: ${{ matrix.arch == 'arm64' && inputs.arm64_zip_sha256 || inputs.x86_64_zip_sha256 }}
      DMG_SHA256: ${{ matrix.arch == 'arm64' && inputs.arm64_dmg_sha256 || inputs.x86_64_dmg_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify native runner
        run: python3 tools/check-native-host.py --architecture '${{ matrix.arch }}' --major '${{ matrix.major }}' --output reports/signed/native-host.json
      - name: Install pinned bench dependencies
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r requirements-runtime.txt
      - name: Verify the final signed ZIP and copied DMG app
        run: >-
          python3 tools/verify-release-candidate.py --architecture '${{ matrix.arch }}'
          --release-tag "$RELEASE_TAG" --commit "$EXPECTED_COMMIT"
          --zip-sha256 "$ZIP_SHA256" --dmg-sha256 "$DMG_SHA256"
          --output reports/signed
      - name: Preserve native signed qualification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-${{ matrix.arch }}-${{ matrix.os }}-${{ inputs.expected_commit }}-${{ github.run_attempt }}
          path: reports/signed/
          if-no-files-found: warn
          retention-days: 14
