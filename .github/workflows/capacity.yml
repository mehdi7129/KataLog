name: Synthetic capacity
on:
  workflow_dispatch:
    inputs:
      logs:
        description: Synthetic logs (100 messages each)
        type: choice
        options: ['1000', '10000', '50000']
        default: '50000'
  schedule:
    - cron: '19 4 * * 1'
  pull_request:
    paths:
      - '.github/workflows/capacity.yml'
      - 'Tests/benchmark_library_repository.py'
      - 'tools/write-ci-context.py'
permissions:
  contents: read
concurrency:
  group: capacity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capacity:
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SYNTHETIC_LOG_COUNT: ${{ inputs.logs || '50000' }}
      KATALOG_GCS_ARTIFACTS: ${{ github.workspace }}/reports/capacity/gcs
      KATALOG_UI_ARTIFACTS: ${{ github.workspace }}/reports/capacity/ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Runtime dependencies
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r requirements-runtime.txt
      - name: Conditions and fixture
        run: python3 tools/write-ci-context.py --output reports/capacity/context.json --fixture "$SYNTHETIC_LOG_COUNT logs; 100 messages/log; 500 drones; 5 repeats; synthetic only"
      - name: Query identity, memory and existing latency budgets
        shell: bash
        run: |
          python3 Tests/benchmark_library_repository.py --logs "$SYNTHETIC_LOG_COUNT" --messages 100 --drones 500 --repeats 5 --output reports/capacity/library.json 2>&1 | tee reports/capacity/library.log
      - name: GCS preparation and pipeline, native rendering
        if: ${{ !cancelled() }}
        run: |
          python3 tools/run-swift-tests.py --summary reports/capacity/swift.json --log reports/capacity/swift.log -- --jobs 2 --disable-sandbox --scratch-path /tmp/katalog-capacity --filter 'GCSStoreTests/testQueuePlannerKeepsOneJobPerSourceAcrossFiveHundredIdentities|GCSStoreTests/testDelayedCollectionPipelineBenchmark|GCSBackgroundIOTests|WorkspacePreviewTests/testLargeFlightTotalAndCompleteMapFitBothThemes'
      - name: Keep measurements even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capacity-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/capacity/
          retention-days: 30
          if-no-files-found: warn
