<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KataLog · maquettes 0.6</title><style>

1px;font-weight:650;margin:7px 0 9px}h2{font-size:17px;font-weight:600;letter-spacing:-.3px;margin:0}h3{font-size:13px;margin:0}p{line-height:1.6;color:var(--muted);margin:7px 0}.title-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}.subtitle{color:var(--muted);font-size:12px}.scope{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:13px;margin-bottom:23px}.scope input{flex:1;min-width:160px;border:0;background:none;outline:0;padding:5px}.chip{font-size:11px;background:var(--raised);border-radius:6px;padding:7px 10px}.chip strong{font-weight:550}.reset{border:0;background:none;color:var(--muted);font-size:11px;margin-left:auto}.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:22px;min-width:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);margin-bottom:25px;padding:0 0 22px;gap:18px}.stat b{display:block;font-size:29px;font-weight:550;letter-spacing:-1px;margin-bottom:7px}.stat span{font-size:11px;color:var(--muted)}.card-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.badge{font-size:10px;background:var(--raised);padding:5px 8px;border-radius:5px;color:var(--muted)}.muted{color:var(--muted)}.green{color:var(--mint)}.amber{color:var(--amber)}.red{color:var(--red)}.row{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row .grow{flex:1;min-width:0}.row small{display:block;color:var(--muted);margin-top:6px;font-size:11px}.row strong{font-weight:550}.bar{background:var(--raised);height:7px;border-radius:20px;overflow:hidden}.bar span{display:block;background:var(--mint);height:100%;border-radius:20px}.family{padding:13px 0}.family .label{display:flex;justify-content:space-between;margin-bottom:9px;font-size:11px}.mini{font-size:10px;color:var(--muted)}table{width:100%;border-collapse:collapse;margin-top:12px}th{text-align:left;font-weight:450;color:var(--muted);font-size:10px;padding:12px 8px;border-bottom:1px solid var(--line)}td{padding:16px 8px;border-bottom:1px solid var(--line);font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px}.below{margin-top:18px}.pagination{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:17px}.graph{width:100%;height:180px;display:block}.graph .gridline{stroke:var(--line);stroke-width:1}.graph .curve{fill:none;stroke:var(--mint);stroke-width:2}.graph text{fill:var(--muted);font:9px -apple-system,sans-serif}.graph .cursor{stroke:var(--amber);stroke-dasharray:4 4}.map{position:relative;min-height:255px;background:var(--raised);border-radius:10px;overflow:hidden}.map svg{width:100%;height:270px}.map-caption{position:absolute;bottom:12px;left:12px;background:var(--card);padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:10px}.tabs{display:flex;gap:22px;margin:20px 0;border-bottom:1px solid var(--line);color:var(--muted)}.tabs span{padding-bottom:13px}.tabs .active{color:var(--ink);border-bottom:2px solid var(--ink)}.description{padding:14px 0}.callout{background:var(--raised);padding:14px;border-radius:10px;font-size:11px;line-height:1.7;color:var(--muted)}.progress-title{font-size:38px;font-weight:550;letter-spacing:-1.6px;margin:22px 0 12px}.progress-title span{font-size:12px;font-weight:450;color:var(--muted);letter-spacing:0}.phase{display:flex;justify-content:space-between;margin:12px 0;color:var(--muted);font-size:11px}.phases{display:flex;gap:10px;margin-top:18px}.phases span{border:1px solid var(--line);border-radius:5px;padding:7px;font-size:10px}.check{color:var(--mint)}.options{display:grid;gap:12px;margin:20px 0}.option{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;gap:12px}.option.active{border-color:var(--ink)}.option span{font-size:11px;line-height:1.6;color:var(--muted)}.alert{margin-top:20px;color:var(--amber);font-size:11px;line-height:1.7}.preview{background:var(--bg);border:1px solid var(--line);padding:25px;border-radius:9px;min-height:315px}.preview h2{font-size:25px;letter-spacing:-.7px}.preview .stats{grid-template-columns:repeat(2,1fr);margin-top:25px}.preview .stat b{font-size:21px}.notice{font-size:10px;color:var(--muted);border-top:1px solid var(--line);padding:14px 30px}.banner{position:fixed;right:20px;bottom:18px;background:var(--ink);color:var(--bg);padding:12px 17px;border-radius:10px;font-size:11px;box-shadow:0 4px 25px #0002;display:none}@media(max-width:1100px){aside{width:180px}.grid{grid-template-columns:1fr}.stats{gap:12px}article{padding:22px}.toolbar{padding:0 22px}}@media(max-width:700px){aside{width:64px;padding:24px 7px}.brand{font-size:0}.brand svg{width:30px;margin:auto}.tag,.footer,.eyebrow{display:none}.nav button{font-size:0}.nav button:first-letter{font-size:17px}.stats{grid-template-columns:repeat(2,1fr)}.toolbar .source{display:none}article{padding:18px}.title-row{align-items:flex-start}h1{font-size:26px}table .optional{display:none}.chip{font-size:10px}.scope{gap:7px}}
</style><body class="dark"><div class="shell"><aside><div class="brand"><svg viewBox="0 0 32 32"><path d="M3 8 16 1l13 7-13 7zm0 8 13 7 13-7v5l-13 7-13-7zm0-5 13 7 13-7v4l-13 7-13-7z"/></svg>kataLOG</div><div class="tag">Les traces de votre flotte.</div><div class="eyebrow">Espace de travail</div><nav class="nav"><button class="active" data-page="history">◫ &nbsp; Historique</button><button data-page="analysis">⌁ &nbsp; Analyse du log</button><button data-page="collection">↓ &nbsp; Collecte GCS</button><button data-page="storage">▣ &nbsp; Stockage</button><button data-page="export">▤ &nbsp; Rapports</button></nav><div class="footer"><span class="dot"></span>Bibliothèque locale<br>Maquette 0.6 · données fictives</div></aside><main><header class="toolbar"><span class="source">Bibliothèque de démonstration</span><span class="spacer"></span><button id="theme">☼ &nbsp; Mode clair</button><button class="primary" data-demo="Import de dossier">＋ &nbsp; Importer un dossier</button></header><article id="content"></article><div class="notice">Proposition visuelle · données synthétiques · les fonctions 0.6 représentées ici sont en développement.</div></main></div><div class="banner" id="toast"></div><script>
const scope=`<div class="scope"><input aria-label="Recherche" placeholder="Rechercher un drone, un fichier ou un message…"><span class="chip"><strong>Flotte</strong> · 8 identités</span><span class="chip"><strong>Période</strong> · Saison 2026</span><span class="chip"><strong>Niveaux</strong> · Tous</span><button class="reset" data-demo="Filtres réinitialisés">Réinitialiser</button></div>`;
const head=(title,subtitle,action='')=>`<div class="title-row"><div><div class="eyebrow">Bibliothèque de démonstration</div><h1>${title}</h1><div class="subtitle">${subtitle}</div></div>${action}</div>`;
const stats=`<div class="stats"><div class="stat"><b>8</b><span>Identités observées</span></div><div class="stat"><b>128</b><span>Logs de la sélection</span></div><div class="stat"><b>26 h 14</b><span>Durée enregistrée</span></div><div class="stat"><b>19</b><span>Logs avec alertes</span></div></div>`;
const families=`<div class="family"><div class="label"><span>Batterie</span><strong>12 logs</strong></div><div class="bar"><span style="width:63%"></span></div></div><div class="family"><div class="label"><span>Navigation</span><strong>7 logs</strong></div><div class="bar"><span style="width:37%"></span></div></div><div class="family"><div class="label"><span>Capteurs</span><strong>4 logs</strong></div><div class="bar"><span style="width:21%"></span></div></div>`;
const curve=(label,color='var(--mint)')=>`<div class="card-head"><h3>${label}</h3><span class="badge">Données réduites · 512 / 6 400 points</span></div><svg class="graph" viewBox="0 0 700 170"><path class="gridline" d="M30 25H685 M30 65H685 M30 105H685 M30 145H685"/><path d="M30 48 60 47 85 51 110 50 135 60 160 63 195 60 210 74 240 73 260 78 285 78 310 94 337 92 360 106 390 100 M430 113 455 114 480 115 510 128 535 121 560 120 595 131 620 134 650 132 685 140" style="fill:none;stroke:${color};stroke-width:2"/><path class="cursor" d="M337 15V150"/><circle cx="337" cy="92" r="4" fill="${color}"/><text x="30" y="163">00:00</text><text x="320" y="163">02:14</text><text x="655" y="163">04:30</text></svg>`;
const map=`<div class="map"><svg viewBox="0 0 650 270"><rect width="650" height="270" fill="var(--raised)"/><path d="M-10 210 650 20M50-20 290 300M400-20 520 300M-20 60 670 165" stroke="var(--card)" stroke-width="21"/><path d="M40 230 135 200 230 165 320 140 420 108 515 95 590 50" fill="none" stroke="var(--mint)" stroke-width="3"/><circle cx="320" cy="140" r="6" fill="var(--amber)" stroke="var(--card)" stroke-width="3"/></svg><span class="map-caption">Apple Maps · trajectoire de démonstration · t = 02:14</span></div>`;
const rows=[['DEMO-A','log_01.ulg','18 janv. · 10:24','08 min 32','3 alertes','amber'],['DEMO-B','log_02.ulg','18 janv. · 10:18','09 min 11','Sans alerte texte','green'],['DEMO-C','log_03.ulg','17 janv. · 14:08','07 min 48','2 alertes','amber'],['DEMO-D','log_04.ulg','Date inconnue','06 min 02','Lecture partielle','muted']].map(r=>`<tr><td><strong>${r[0]}</strong><div class="mini mono">Contrôleur distinct</div></td><td class="mono">${r[1]}</td><td>${r[2]}</td><td class="optional">${r[3]}</td><td class="${r[5]}">${r[4]}</td><td><button data-page="analysis">Ouvrir ↗</button></td></tr>`).join('');
const pages={history:()=>head('L’historique de votre flotte','Retrouver chaque enregistrement, depuis le premier import.',`<button data-page="export">Exporter la sélection ↗</button>`)+scope+stats+`<div class="grid"><section class="card"><div class="card-head"><h2>À examiner</h2><span class="badge">19 logs concernés</span></div><div class="row"><span class="amber">△</span><div class="grow"><strong>Lecture de batterie indisponible</strong><small>12 logs · 3 contrôleurs · source conservée</small></div><button data-page="analysis">Examiner</button></div><div class="row"><span class="amber">△</span><div class="grow"><strong>État GNSS dégradé</strong><small>7 logs · 2 contrôleurs · événements disponibles</small></div><button data-page="analysis">Examiner</button></div><p class="mini">Une observation enregistrée n’est pas une panne confirmée.</p></section><section class="card"><div class="card-head"><h2>Familles les plus fréquentes</h2><span class="badge">Logs uniques</span></div>${families}<p class="mini">Les familles peuvent se recouper. Afficher le radar ↗</p></section></div><section class="card below"><div class="card-head"><h2>Enregistrements</h2><span class="badge">128 résultats · plus récents d’abord</span></div><table><thead><tr><th>DRONE</th><th>FICHIER</th><th>DATE SOURCE</th><th class="optional">DURÉE</th><th>OBSERVATIONS</th><th></th></tr></thead><tbody>${rows}</tbody></table><div class="pagination"><span class="mini">1–4 sur 128</span><button data-demo="Page précédente">←</button><button data-demo="Page suivante">→</button></div></section>`,analysis:()=>head('DEMO-A · log_01.ulg','Enregistrement de démonstration · 18 janvier 2026 · 10:24',`<button data-page="export">Exporter cette fiche ↗</button>`)+`<div class="tabs"><span>Vue du log</span><span class="active">Analyse</span><span>Messages</span><span>Événements</span><span>Paramètres</span><span>Couverture</span></div><div class="grid"><section class="card">${curve('Tension batterie · instance 0 · V')}<div class="phase"><span>t = 02:14 · 15,4 V</span><span>Couverture 96 % · lacune conservée</span></div>${curve('GNSS · instance 1 · précision horizontale (m)','var(--amber)')}</section><section class="card"><div class="card-head"><h2>Contexte au même instant</h2><span class="badge">02:14</span></div>${map}<div class="row"><span class="amber">△</span><div class="grow"><strong>Événement PX4 enregistré</strong><small>Arguments bruts conservés · dictionnaire exact absent</small></div></div><div class="callout">Les courbes, messages et positions partagent le temps relatif du log. Une proximité temporelle n’établit pas une cause.</div></section></div>`,collection:()=>head('Collecte GCS','Les logs de votre flotte, dans le dossier que vous avez choisi.',`<div><button data-demo="Ajout des drones connectés">Tout collecter</button> <button class="primary" data-demo="Arrêt local demandé">Arrêter</button></div>`)+`<div class="grid"><section class="card"><div class="card-head"><h2>Progression de la collecte</h2><span class="badge">2 drones en transfert</span></div><div class="progress-title">62 % <span>du volume prévu vers le Mac</span></div><div class="bar" style="height:12px"><span style="width:62%"></span></div><div class="phase"><span>124 Mo / 200 Mo</span><span>8 / 12 fichiers vérifiés</span></div><div class="phases"><span class="check">✓ Inventaires 2 / 2</span><span>Copie vers le Mac</span><span>Vérification</span><span>Analyse</span></div><div class="callout below">Arrêter conserve les fichiers déjà vérifiés. La GCS peut finir une copie drone déjà lancée ; l’arrêt distant n’est pas confirmé.</div></section><section class="card"><h2>Destination</h2><div class="description"><strong>Archives de la flotte</strong><p class="mono">Dossier choisi · disponible</p></div><div class="row"><span class="check">✓</span><div class="grow"><strong>42 logs déjà présents</strong><small>Empreintes vérifiées · aucun nouveau téléchargement</small></div></div><button data-demo="Choix du dossier de destination">Modifier le dossier…</button></section></div><section class="card below"><div class="card-head"><h2>Transferts</h2><button data-demo="Mise en pause après les fichiers actifs">Mettre en pause</button></div><div class="row"><span class="dot"></span><div class="grow"><strong>DEMO-A · log_05.ulg</strong><small>Drone → GCS terminé · copie GCS → Mac en cours</small></div><div style="width:160px"><div class="bar"><span style="width:35%"></span></div><p class="mini">7 / 20 Mo vers le Mac</p></div></div><div class="row"><span class="dot"></span><div class="grow"><strong>DEMO-B · log_06.ulg</strong><small>Copie drone → GCS en cours</small></div><span class="muted">72 % de cette phase</span></div><div class="row"><span class="amber">△</span><div class="grow"><strong>DEMO-C · en attente</strong><small>Drone hors ligne · sa file reste conservée</small></div><span class="muted">Sans bloquer les autres</span></div></section>`,storage:()=>head('Conserver votre historique','Sauvegarder vos analyses, retrouver leurs sources et restaurer sans perdre les annotations.')+`<div class="grid"><section class="card"><div class="card-head"><h2>Sauvegarde de la bibliothèque</h2><span class="badge">Locale</span></div><div class="options"><div class="option active"><span>◉</span><div><strong>Analyses et réglages</strong><p>Bibliothèque, numéros, familles, vues et historique de collecte.</p><span>Estimation de démonstration · 18 Mo</span></div></div><div class="option"><span>○</span><div><strong>Complète avec les ULog disponibles</strong><p>Inclut les originaux vérifiés pour les analyses futures.</p><span>Estimation de démonstration · 2,4 Go</span></div></div></div><button class="primary" data-demo="Préparation d’une sauvegarde vérifiée">Créer une sauvegarde…</button> <button data-demo="Prévisualisation de restauration">Restaurer…</button><p class="mini">La restauration est vérifiée avant de remplacer les fichiers actifs. L’état précédent est conservé.</p></section><section class="card"><h2>État des sources</h2><div class="row"><span class="check">✓</span><div class="grow"><strong>116 sources disponibles</strong><small>Copies locales de la collecte et archives SD</small></div></div><div class="row"><span class="amber">△</span><div class="grow"><strong>12 sources sur un volume hors ligne</strong><small>Les analyses conservées restent consultables</small></div></div><button data-demo="Réassociation par empreinte SHA">Retrouver une source…</button><div class="callout below">Importer une SD peut référencer les originaux ou les copier dans vos archives. Une copie GCS déjà vérifiée est réutilisée.</div></section></div><section class="card below"><h2>Avant de restaurer</h2><p>Vous verrez le nombre de logs, les annotations, les sources incluses et les fichiers absents. Les transferts interrompus ne redémarrent pas automatiquement.</p><div class="stats" style="margin-top:20px;margin-bottom:0;border:0"><div class="stat"><b>128</b><span>Analyses conservées</span></div><div class="stat"><b>8</b><span>Identités distinctes</span></div><div class="stat"><b>3</b><span>Vues enregistrées</span></div><div class="stat"><b>2,4 Go</b><span>ULog disponibles</span></div></div></section>`,export:()=>head('Un rapport du bon périmètre','Une synthèse lisible et toutes les observations que vous avez choisi de conserver.')+`<div class="grid"><section class="card"><h2>Préparer le rapport</h2><div class="options"><div class="option active"><span>◉</span><div><strong>Sélection courante</strong><p>8 identités · saison 2026 · tous les niveaux</p><span>128 logs · 2 560 messages · sources annoncées</span></div></div><div class="option"><span>○</span><div><strong>Toute la bibliothèque</strong><p>Sans limiter aux pages ou filtres actuellement visibles.</p></div></div></div><div class="row"><div class="grow"><strong>Format</strong><small>Autonome et utilisable hors ligne</small></div><span class="badge">HTML interactif</span></div><div class="row"><div class="grow"><strong>Détails</strong><small>Messages, mesures, couverture et provenance</small></div><span class="check">Inclus</span></div><div class="row"><div class="grow"><strong>Partage</strong><small>Inclure identifiants et positions</small></div><button data-demo="Prévisualisation des données à masquer">Personnaliser…</button></div><p class="mini">Estimation de démonstration · 1,8 Mo. Si le rapport devient trop volumineux, une synthèse et les données complètes jointes seront proposées.</p><button class="primary" data-demo="Export de la sélection">Exporter le rapport…</button></section><section class="card"><div class="card-head"><h2>Aperçu</h2><span class="badge">Sélection courante</span></div><div class="preview"><div class="eyebrow">kataLOG · rapport local</div><h2>Les traces de votre flotte.</h2><p>Saison 2026 · données de démonstration</p><div class="stats"><div class="stat"><b>128</b><span>Logs analysés</span></div><div class="stat"><b>19</b><span>Avec alertes</span></div></div><h3>Familles observées</h3>${families}</div></section></div>`};
function show(page){document.querySelector('#content').innerHTML=pages[page]();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelector('main').scrollIntoView({block:'start'})}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)show(b.dataset.page);if(b.id==='theme'){document.body.classList.toggle('dark');b.textContent=document.body.classList.contains('dark')?'☼  Mode clair':'◐  Mode sombre'}if(b.dataset.demo){const t=document.querySelector('#toast');t.textContent=b.dataset.demo+' · maquette';t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2200)}});show('history');
</script></body></html>
