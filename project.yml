name: KataLog
options:
  bundleIdPrefix: com.mehdiguiard
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 15.0
    CODE_SIGNING_ALLOWED: NO
targets:
  KataLogCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/KataLogCore
  KataLog:
    type: application
    platform: macOS
    sources:
      - path: Sources/KataLog
        excludes:
          - Resources
      - path: Sources/KataLog/Resources
        buildPhase: resources
        excludes:
          - __pycache__
      - path: assets/icon/KataLog.icns
        buildPhase: resources
    dependencies:
      - target: KataLogCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehdiguiard.katalog
        MARKETING_VERSION: 0.5.1
        CURRENT_PROJECT_VERSION: 6
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KataLog
        INFOPLIST_KEY_CFBundleIconFile: KataLog
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: KataLog se connecte à votre GCS pour découvrir votre flotte et récupérer ses logs.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        SWIFT_EMIT_LOC_STRINGS: YES
