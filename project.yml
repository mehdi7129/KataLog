name: KataLog
options:
  bundleIdPrefix: com.mehdiguiard
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 15.0
    CODE_SIGNING_ALLOWED: NO
targets:
  KataLogCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/KataLogCore
  KataLog:
    type: application
    platform: macOS
    sources:
      - path: Sources/KataLog
        excludes:
          - Resources
      - path: Sources/KataLog/Resources
        buildPhase: resources
        excludes:
          - __pycache__
      - path: assets/icon/KataLog.icns
        buildPhase: resources
    dependencies:
      - target: KataLogCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehdiguiard.katalog
        MARKETING_VERSION: 0.6.1
        CURRENT_PROJECT_VERSION: 15
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KataLog
        INFOPLIST_KEY_CFBundleIconFile: KataLog
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: KataLog se connecte à votre GCS pour découvrir votre flotte et récupérer ses logs.
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: KataLog accède aux dossiers de logs choisis sur votre Bureau pour les analyser et y conserver les copies collectées.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_KatalogSparkleVersion: 2.10.0
        INFOPLIST_KEY_KatalogUpdatesEnabled: NO
        INFOPLIST_KEY_KatalogUpdateChannel: disabled
        INFOPLIST_KEY_SUEnableAutomaticChecks: NO
        INFOPLIST_KEY_SUAutomaticallyUpdate: NO
        INFOPLIST_KEY_SUAllowsAutomaticUpdates: NO
        INFOPLIST_KEY_SUEnableSystemProfiling: NO
        INFOPLIST_KEY_SUEnableJavaScript: NO
        INFOPLIST_KEY_SUVerifyUpdateBeforeExtraction: YES
        INFOPLIST_KEY_SURequireSignedFeed: YES
        INFOPLIST_KEY_SUSignedFeedFailureExpirationInterval: 0
        SWIFT_EMIT_LOC_STRINGS: YES
